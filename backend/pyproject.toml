[project]
name = "planminds-backend"
version = "1.0.0"
description = "PlanMinds Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.1",
    "firebase-admin>=6.8.0",
    "groq>=0.13.1",
    "apscheduler>=3.10.4",
    "exponent_server_sdk>=2.0.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0",
    "cachetools>=5.5.0",
    "python-json-logger>=3.2.1",
    "aiosmtplib>=3.0.1",
    "redis>=5.2.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.12",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
